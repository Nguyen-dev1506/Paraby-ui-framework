name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Fix Tkinter/Tcl on Windows if broken
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python -c "import tkinter; tkinter.Tk()" 2>$null
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Tkinter loi, cai Tcl qua Chocolatey va tro dan duong dan..."
          choco install tcl -y --no-progress
          $tclPath = Get-ChildItem -Path "C:\" -Filter "tcl8.6" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          $tkPath = Get-ChildItem -Path "C:\" -Filter "tk8.6" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tclPath) {
            echo "TCL_LIBRARY=$($tclPath.FullName)" >> $env:GITHUB_ENV
            Write-Host "Da set TCL_LIBRARY = $($tclPath.FullName)"
          }
          if ($tkPath) {
            echo "TK_LIBRARY=$($tkPath.FullName)" >> $env:GITHUB_ENV
            Write-Host "Da set TK_LIBRARY = $($tkPath.FullName)"
          }
          python -c "import tkinter; tkinter.Tk()"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Van khong sua duoc Tkinter sau khi set TCL_LIBRARY/TK_LIBRARY"
          } else {
            Write-Host "Da sua thanh cong."
          }
        } else {
          Write-Host "Tkinter OK, khong can sua."
        }

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: pytest tests/ -v

    - name: Run tests (Ubuntu)
      if: runner.os == 'Linux'
      uses: GabrielBB/xvfb-action@v1
      with:
        run: pytest tests/ -v
