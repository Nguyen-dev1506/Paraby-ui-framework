name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Verify Tkinter works (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python -c "import tkinter; tkinter.Tk()" 2>$null
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Tkinter/Tcl bi loi, dang cai lai qua Chocolatey..."
          choco install tcl -y --no-progress
        } else {
          Write-Host "Tkinter OK, khong can sua."
        }

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: pytest tests/ -v

    - name: Run tests (Ubuntu)
      if: runner.os == 'Linux'
      uses: GabrielBB/xvfb-action@v1
      with:
        run: pytest tests/ -v
