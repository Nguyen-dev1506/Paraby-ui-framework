name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # Python 3.10/3.11 trên windows-latest bị lỗi hạ tầng Tcl/Tk từ phía GitHub Actions
          # hosted tool cache (thiếu init.tcl), không phải lỗi code Paraby. check-latest: true
          # đã được thử nhưng không khắc phục được. Tạm loại trừ, cân nhắc thêm lại khi 
          # GitHub sửa lỗi phía họ hoặc khi có bằng chứng đã ổn định trở lại.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        check-latest: true

    - name: Install dependencies
      run: pip install -e ".[dev]"


    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: pytest tests/ -v

    - name: Run tests (Ubuntu)
      if: runner.os == 'Linux'
      uses: GabrielBB/xvfb-action@v1
      with:
        run: pytest tests/ -v
